<!doctype html>
<html lang="et" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hüüf – korilase kompass</title>
  <meta name="description" content="Kus on täna ja lähipäevil kõige tõenäolisem leida kukeseeni.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="kaart" aria-label="Kaart"></div>

  <button type="button" id="brand" class="brand klaas" title="Mida kukeseen vajab" aria-haspopup="dialog">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <!-- harilik kukeseen: wavy funnel cap, ridges running down the stem -->
      <path class="logo-seen" d="M3.5 11.5C4.5 8.2 8 7.2 11 8.8c3-1.9 6.2-1.2 9 .4 2.8-1.6 6-2.3 9-.4 3-1.6 6.5-.6 7.5 2.7-1 3.6-7.6 7-11.6 10.6l-.5 11.4c0 1.8-1.7 3-4.4 3s-4.4-1.2-4.4-3l-.5-11.4C11.1 18.5 4.5 15.1 3.5 11.5z"/>
      <path class="logo-lehter" d="M9 10.6c5.5 2.2 16.5 2.2 22 0"/>
      <g class="logo-voldid">
        <path d="M8 13.6c4 2 7 4.6 8.6 9"/><path d="M13.5 15.3c2.3 1.8 3.8 4.3 4.6 7.9"/>
        <path d="M20 15.9v8"/><path d="M26.5 15.3c-2.3 1.8-3.8 4.3-4.6 7.9"/><path d="M32 13.6c-4 2-7 4.6-8.6 9"/>
      </g>
    </svg>
    <div class="brand-tekst">
      <strong>Hüüf</strong>
      <span>Harilik kukeseen</span>
      <span class="ladina">Cantharellus cibarius</span>
    </div>
  </button>

  <div class="nurganupud">
    <div class="menyy-hoidja">
      <button id="aluskaart-nupp" class="ring klaas" aria-expanded="false" aria-controls="aluskaart" title="Aluskaart" aria-label="Aluskaart">
        <svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>
      </button>
      <div id="aluskaart" class="menyy klaas" role="group" aria-label="Aluskaart" hidden>
        <span class="menyy-pealkiri">Aluskaart</span>
        <button data-kiht="loodus" class="aktiivne">Looduskaart</button>
        <button data-kiht="topo">Topo</button>
        <button data-kiht="foto">Ortofoto</button>
        <button data-kiht="kaart">Eesti kaart</button>
      </div>
    </div>
    <button id="giid-nupp" class="ring klaas" title="Kuidas hinne tekib" aria-label="Kuidas hinne tekib">
      <svg viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.25c-.7.35-1.1 1-1.1 1.75v.5M12 17h.01"/></svg>
    </button>
  </div>

  <section id="parimad-kaart" class="parimad-kaart klaas">
    <button id="parimad-pea" class="kaardikaart-pea" aria-expanded="true" aria-controls="parimad">
      <span>Parimad kohad</span>
      <svg class="nool" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ol id="parimad" class="parimad"></ol>
  </section>

  <section id="ajatelg" class="ajatelg klaas" aria-live="polite">
    <div class="ajatelg-pea">
      <div id="reziim" class="segment" role="group" aria-label="Mida kaart näitab">
        <button data-reziim="tana" class="aktiivne">Kus otsida</button>
        <button data-reziim="koht">Head metsad</button>
        <button data-reziim="peidus" class="peida" title="Peida seenekaart" aria-label="Peida seenekaart">
          <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>
        </button>
      </div>
      <label id="kalender" class="ring-vaike kalender" title="Vali muu kuupäev">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <input type="date" id="kuupaev" aria-label="Vali kuupäev">
      </label>
    </div>

    <div id="paeva-osa" class="paevarida">
      <div id="paevad" class="paevad" role="group" aria-label="Päev"></div>
    </div>

    <p id="kokkuvote" class="kokkuvote"></p>
    <ul id="legend" class="legend"></ul>
  </section>

  <aside id="sahtel" class="sahtel klaas" hidden aria-labelledby="sahtel-pealkiri">
    <header class="sahtel-pea">
      <div class="sahtel-pea-vasak"><span id="sahtel-hinne" class="sahtel-hinne"></span>
        <div class="sahtel-pea-tekst"><span id="sahtel-silt" class="otsus-silt"></span><div id="sahtel-koord" class="koord"></div></div></div><h2 id="sahtel-pealkiri" class="peidetud">Koha selgitus</h2>
      <button id="sahtel-sulge" class="ring-vaike" title="Sulge" aria-label="Sulge">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="selgitus" class="sahtel-sisu"></div>
  </aside>

  <dialog id="seeninfo" aria-labelledby="seeninfo-pealkiri">
    <header class="giid-pea">
      <h2 id="seeninfo-pealkiri">Harilik kukeseen</h2>
      <button class="ring-vaike" id="seeninfo-sulge" title="Sulge" aria-label="Sulge">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="seeninfo-sisu"></div>
  </dialog>

  <!-- TEMPORARY: look variants of the mushroom layer -->
  <div id="variandid" class="segment klaas" role="group" aria-label="Kihi variant"></div>

  <dialog id="giid" aria-labelledby="giid-pealkiri">
    <header class="giid-pea">
      <h2 id="giid-pealkiri">Kuidas hinne tekib</h2>
      <button class="ring-vaike" id="giid-sulge" title="Sulge" aria-label="Sulge">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="giid-sisu"></div>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
